name: Backup Vercel Blob

on:
  schedule:
    # Before /api/cron/cleanup (03:30) deletes expired files, and off the hourly db-backup window
    # (04–22) to avoid FTP contention.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Remote base dir (leave default for safe test runs)'
        required: false
        default: '/blob_backups/test/'

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REMOTE_BASE: ${{ github.event.inputs.target_dir || '/blob_backups/' }}
      MIN_BLOBS: '1500'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Fetch previous manifest from FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          LFTP_OPTS="set ftp:ssl-auth TLS; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set xfer:clobber on;"
          MANIFEST_DIR="${REMOTE_BASE}manifests/"
          : > prev.json

          # lftp lists; the shell sorts (lftp's pipe parsing is flaky).
          PREV_NAME=$(lftp -c "
            $LFTP_OPTS
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            cd '$MANIFEST_DIR';
            cls -1 manifest-*.json
          " 2>/dev/null | sort | tail -1 || true)

          if [ -z "$PREV_NAME" ]; then
            echo "ℹ️ no previous manifest in $MANIFEST_DIR — full seed run"
          else
            echo "🔁 previous manifest: $PREV_NAME"
            lftp -c "
              $LFTP_OPTS
              open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
              cd '$MANIFEST_DIR';
              get '$PREV_NAME' -o prev.json
            "
          fi

      - name: Mirror new blobs to local dir
        env:
          # The PRODUCTION Blob token, and it must stay production — this job backs up prod.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          export SNAPSHOT_STAMP=$(date +%Y%m%d-%H%M%S)
          echo "STAMP=$SNAPSHOT_STAMP" >> "$GITHUB_ENV"
          node scripts/blob-mirror.mjs \
            --prev-manifest prev.json \
            --out ./blob-out \
            --min-blobs "$MIN_BLOBS"

      - name: Upload new blobs and manifest via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          LFTP_OPTS="set ftp:ssl-auth TLS; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode on;"
          MEDIA_DIR="${REMOTE_BASE}media/"
          MANIFEST_DIR="${REMOTE_BASE}manifests/"

          # mirror -R (local -> remote) WITHOUT --delete: additive only.
          # Put the manifest BEFORE the lcd: after it, `./blob-out/...` resolves inside media/.
          # lcd into the source and mirror `.`: `mirror -R <dir>` nests it remotely (media/media/).
          lftp -c "
            $LFTP_OPTS
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mkdir -p -f '$MEDIA_DIR';
            mkdir -p -f '$MANIFEST_DIR';
            put -O '$MANIFEST_DIR' ./blob-out/manifest-${STAMP}.json;
            lcd ./blob-out/media;
            mirror -R --no-perms . '$MEDIA_DIR';
            bye
          "
          echo "✅ Uploaded new blobs + manifest-${STAMP}.json to $REMOTE_BASE"
